# Local Development Docker Compose Configuration
# Use: docker compose -f docker-compose.local.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: todoapp
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d todoapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  php-fpm:
    image: php:8.2-fpm-alpine
    container_name: local_php-fpm
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: todoapp
      DB_USER: todouser
      DB_PASS: todopass
    volumes:
      - ./src:/var/www/html
      - ./docker/php-entrypoint.sh:/usr/local/bin/php-entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    entrypoint: ["/usr/local/bin/php-entrypoint.sh"]

  nginx:
    image: nginx:alpine
    container_name: local_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
    depends_on:
      - php-fpm
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
