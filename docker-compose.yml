services:
  test_nginx:
    image: nginx:alpine
    container_name: test_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
    depends_on:
      - test_php-fpm
    networks:
      - test_network

  test_php-fpm:
    image: php:8.2-fpm-alpine
    container_name: test_php-fpm
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    networks:
      - test_network

networks:
  test_network:
    driver: bridge
